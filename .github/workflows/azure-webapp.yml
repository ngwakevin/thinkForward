name: Deploy Next.js to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC federated credentials
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Base URL of the deployed Azure Web App (update if custom domain is added)
  APP_BASE_URL: https://learnapp.azurewebsites.net
  # Runtime env vars pulled from GitHub secrets (add them in repo settings)
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  # Embedded (non-secret) Azure identifiers (user requested these be hard-coded)
  # NOTE: Subscription ID and Tenant ID are generally safe to expose; the Client ID still comes from a secret.
  AZURE_SUBSCRIPTION_ID: ba0cdaec-11b4-48fc-8941-0930ab748543
  # Updated tenant ID (previous value 438537ce-67d5-4799-837e-aa8ba4ed01eb replaced at user request)
  AZURE_TENANT_ID: 91347cb6-c2b2-44ed-bc6d-9d72e3337f8b

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets present
        run: |
          missing=()
          for v in DATABASE_URL NEXTAUTH_URL NEXTAUTH_SECRET NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              missing+=("$v")
            fi
          done
          # Only the Azure Client ID must be provided as a secret; subscription & tenant IDs are embedded above.
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "Missing Azure OIDC secret: AZURE_CLIENT_ID" >&2
            missing+=("AZURE_CLIENT_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required secrets missing: ${missing[*]}" >&2
            exit 1
          fi
          echo "All required secrets present." 

      - name: Run Prisma migrations (deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Export build metadata
        run: echo "BUILD_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build (Prisma generate + Next build)
        run: npm run build:ci

      - name: Prepare deployment package (standalone)
        run: |
          mkdir -p deploy
          # Copy standalone server output
          cp -R .next/standalone/* deploy/
          # Copy static assets
            mkdir -p deploy/.next/static
          cp -R .next/static/* deploy/.next/static/
          # Copy public and prisma (schema + migrations if needed at runtime)
          cp -R public deploy/public
          if [ -d prisma ]; then cp -R prisma deploy/prisma; fi
          # Ensure package.json & lock file for runtime (for next start script if needed)
          cp package.json package-lock.json deploy/ 2>/dev/null || true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: learnapp   # Adjust if different
          package: deploy

      - name: Post-deploy smoke test
        run: |
          echo "Waiting 20s for app warmup..."; sleep 20
          echo "Smoke test HEAD $APP_BASE_URL";
          curl -I "$APP_BASE_URL" || true

      - name: Health check (retry)
        run: |
          attempts=0
          max=6
          until [ $attempts -ge $max ]; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$APP_BASE_URL/api/health" || echo 000)
            echo "Attempt $((attempts+1)) -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json | jq '.' || cat /tmp/health.json
              echo "Health check passed"; exit 0
            fi
            sleep 10
            attempts=$((attempts+1))
          done
          echo "Health check failed after $max attempts" >&2
          echo "Last response:"; cat /tmp/health.json || true
          exit 1
