name: Next.js Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Deep clean environment
        run: |
          echo "Performing complete environment cleanup..."
          rm -rf .next node_modules package-lock.json
          npm cache clean --force
          echo "Removed node_modules, package-lock.json, and cleared npm cache"

      - name: Reinstall dependencies
        run: npm install

      - name: Clean previous builds and cache
        run: |
          echo "Cleaning all build artifacts..."
          rm -rf .next node_modules/.cache node_modules/.next .turbo
          find . -type d -name ".next" -exec rm -rf {} +
          
          # Ensure no Pages Router artifacts remain
          echo "Removing any Pages Router artifacts..."
          rm -rf .next/server/tic/chunks/pages
          rm -rf .next/server/pages

      - name: Make scripts executable
        run: chmod +x scripts/ci-build-fixed.sh

      - name: Temporarily fix package.json for build
        run: |
          # Remove type:module from package.json
          echo "Modifying package.json..."
          cp package.json package.json.bak
          jq 'del(.type)' package.json.bak > package.json
          
          # Make a dummy pages folder with a document file
          echo "Creating minimal pages directory..."
          mkdir -p pages
          cat > pages/_document.js << 'EOL'
          import { Html, Head, Main, NextScript } from 'next/document';
          
          export default function Document() {
            return (
              <Html lang="en">
                <Head />
                <body>
                  <Main />
                  <NextScript />
                </body>
              </Html>
            );
          }
          EOL
          
          # Create a simplified next.config.js that focuses on App Router
          echo "Creating app-router focused next.config.js..."
          cat > next.config.js << 'EOL'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: true,
            output: 'standalone',
            productionBrowserSourceMaps: false,
            webpack: (config, { isServer }) => {
              if (!isServer) {
                config.resolve.fallback = {
                  ...config.resolve.fallback,
                  fs: false, path: false, os: false, net: false,
                  tls: false, child_process: false,
                };
              }
              return config;
            },
          };
          
          module.exports = nextConfig;
          EOL
          
      - name: Build with Next.js
        run: NODE_OPTIONS="--max-old-space-size=4096" npx next build
        env:
          NODE_ENV: "production"
          NEXT_TELEMETRY_DISABLED: "1"
      
      - name: Restore original files
        run: |
          mv package.json.bak package.json
          rm -rf pages
          rm -f next.config.js

      - name: Cleanup temporary files
        run: |
          # Remove any temporary config files
          if [ -f "next.config.js" ]; then
            rm -f next.config.js
          fi
          
          # Additional debugging information
          echo "Final build structure:"
          ls -la .next/
          echo "Server directory structure:"
          ls -la .next/server/ || echo "No server directory found"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: next-build
          path: .next/
          retention-days: 3