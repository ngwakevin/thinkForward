name: Next.js Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean previous builds and cache
        run: |
          echo "Cleaning all build artifacts..."
          rm -rf .next node_modules/.cache node_modules/.next .turbo
          find . -type d -name ".next" -exec rm -rf {} +
          
          # Ensure no Pages Router artifacts remain
          echo "Removing any Pages Router artifacts..."
          rm -rf .next/server/tic/chunks/pages
          rm -rf .next/server/pages

      - name: Make scripts executable
        run: chmod +x scripts/ci-build-fixed.sh

      - name: Build with App Router only
        run: ./scripts/ci-build-fixed.sh
        env:
          # Explicitly tell Next.js we're using App Router only
          NEXT_PRIVATE_PREBUNDLED_REACT: "next"
          NEXT_PRIVATE_STANDALONE: "1"
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: next-build
          path: .next/
          retention-days: 3