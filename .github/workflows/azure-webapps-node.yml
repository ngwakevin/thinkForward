name: Azure Web App Deployment

on:
  push:
    branches: [ "main", "azure-deploy-clean", "newImplement-hardening" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: ${{ github.event.inputs.environment == 'production' && 'thinkforward' || 'thinkforward-dev' }}
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  # Azure Resources
  COSMOS_DB_ENDPOINT: ${{ secrets.COSMOS_DB_ENDPOINT }}
  COSMOS_DB_KEY: ${{ secrets.COSMOS_DB_KEY }}
  KEY_VAULT_URI: ${{ secrets.KEY_VAULT_URI }}
  APP_INSIGHTS_CONNECTION_STRING: ${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build and prepare deployment package
        run: |
          # Fix npm issues and prepare environment
          bash scripts/fix-npm-issues.sh
          
          # Create production .env file
          echo "# Production environment settings" > .env.production
          echo "NODE_ENV=production" >> .env.production
          echo "NEXTAUTH_URL=https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> .env.production
          
          # Add Azure resource configurations
          echo "COSMOS_DB_ENDPOINT=${{ secrets.COSMOS_DB_ENDPOINT }}" >> .env.production
          echo "COSMOS_DB_KEY=${{ secrets.COSMOS_DB_KEY }}" >> .env.production
          echo "KEY_VAULT_URI=${{ secrets.KEY_VAULT_URI }}" >> .env.production
          echo "APP_INSIGHTS_CONNECTION_STRING=${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}" >> .env.production
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.production
          
          # Install ALL dependencies including dev dependencies needed for build
          npm ci
          
          # Build the Next.js application - THIS IS CRITICAL
          echo "Building Next.js application..."
          npm run build
          
          # Verify the build succeeded and .next directory exists
          if [ ! -d ".next" ]; then
            echo "ERROR: Build failed - .next directory not found!"
            exit 1
          fi
          
          # Log build information for debugging
          echo "Build completed successfully. Contents of .next directory:"
          ls -la .next/
          echo "Build ID: $(cat .next/BUILD_ID)"
          
          # Prepare Azure deployment scripts
          chmod +x scripts/fix-nextjs-build-dir.sh
          chmod +x scripts/diagnose-nextjs.sh
          chmod +x scripts/create-direct-startup.sh
          chmod +x scripts/create-nextjs-wrapper.js
          
          # Make sure the build directory fix runs during deployment
          echo "Generating startup script with build directory fix..."
          bash scripts/create-direct-startup.sh
          
          # Verify our startup script is created correctly
          if [ ! -f "startup.sh" ]; then
            echo "ERROR: Failed to generate startup.sh"
            exit 1
          fi
          
          # Make sure the startup script is executable
          chmod +x startup.sh
          chmod +x startup.sh
          
          # Create deployment package directly
          echo "Creating deployment package..."
          zip -9 -r deploy.zip package.json package-lock.json .next node_modules public startup.sh next.config.mjs
        env:
          CI: true
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Create Azure config directory with proper permissions
        run: |
          mkdir -p ~/.azure
          chmod 700 ~/.azure
      
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set App Settings for Azure Web App
        run: |
          # Set app settings for the web app
          az webapp config appsettings set --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              COSMOS_DB_ENDPOINT="${{ secrets.COSMOS_DB_ENDPOINT }}" \
              COSMOS_DB_KEY="${{ secrets.COSMOS_DB_KEY }}" \
              KEY_VAULT_URI="${{ secrets.KEY_VAULT_URI }}" \
              APP_INSIGHTS_CONNECTION_STRING="${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}" \
              AZURE_AD_CLIENT_ID="${{ secrets.AZURE_AD_CLIENT_ID }}" \
              AZURE_AD_CLIENT_SECRET="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
              AZURE_AD_TENANT_ID="${{ secrets.AZURE_AD_TENANT_ID }}" \
              NODE_ENV="production" \
              NEXT_TEMP_DIR="/home/site/next-temp" \
              NEXT_DIST_DIR="/home/site/next-temp/.next" \
              NEXT_DISABLE_FILESYSTEM_CACHE="1" \
              NEXT_TELEMETRY_DISABLED="1" \
              NEXTAUTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" \
              NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
          
          # Configure startup command to use our startup script
          az webapp config set --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --startup-file "startup.sh"

      - name: Wait for SCM to be ready
        run: sleep 60
        
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy.zip
      
      - name: Wait for deployment to propagate
        run: sleep 30
          
      - name: Restart Azure Web App
        run: |
          # The subscription is already set by azure/login@v2
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          
      - name: Verify deployment
        run: |
          echo "Waiting for app to fully initialize..."
          sleep 60
          # Check if the webapp is responding
          curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || echo "App still initializing, continue anyway"
# Make sure the following secrets are set in your GitHub repository:
# - AZURE_CREDENTIALS: JSON object with service principal credentials in the format:
#   {
#     "clientId": "<GUID>",
#     "clientSecret": "<STRING>",
#     "subscriptionId": "<GUID>",
#     "tenantId": "<GUID>"
#   }
# 
# To generate AZURE_CREDENTIALS, run:
# az ad sp create-for-rbac --name "myAppDeploymentSP" --role contributor \
#                          --scopes /subscriptions/{subscription-id}/resourceGroups/{resource-group} \
#                          --sdk-auth
# - AZURE_RESOURCE_GROUP: 'thinkforward-dev-rg'
# - AZURE_SUBSCRIPTION_ID: For use in commands after login
# - AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID: Still needed for other resources
