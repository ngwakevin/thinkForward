<?xml version="1.0" encoding="UTF-8"?>
<!-- Business Card Concept Refined (single face) 3.75in x 2.25in w/ bleed @300dpi => 1125 x 675 -->
<svg width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <title>GoUply Business Card Concept Refined v2</title>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071621"/>
      <stop offset="100%" stop-color="#0E2533"/>
    </linearGradient>
    <!-- Large accent orb gradient -->
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C48C"/>
      <stop offset="100%" stop-color="#00A977"/>
    </linearGradient>
    <!-- Subtle stripe pattern inside orb -->
  <pattern id="orbStripes" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(35)">
      <rect width="40" height="40" fill="rgba(255,255,255,0.06)" />
      <rect width="20" height="40" fill="rgba(255,255,255,0.05)" />
    </pattern>
    <mask id="stripeMask">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="770" cy="335" r="235" fill="black" />
    </mask>
    <style>
      .wordmark { font-family: 'Space Grotesk', Inter, sans-serif; font-weight:600; letter-spacing:0.5px; }
      .tagline { font-family: 'Space Grotesk', Inter, sans-serif; font-weight:600; letter-spacing:0.5px; }
      .meta { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:500; letter-spacing:0.5px; }
      .muted { fill:#B5C9D3; }
      .stroke-circle { fill:none; stroke:#F5FAFC; stroke-width:3; opacity:0.85; }
      .divider { stroke:#163544; stroke-width:3; stroke-linecap:round; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1125" height="675" fill="url(#bgGrad)"/>
  <!-- Subtle diagonal overlay texture -->
  <g opacity="0.22">
    <path d="M0 540 L1125 0 V90 L0 630Z" fill="#0E2533" />
    <path d="M0 600 L1125 60 V145 L0 675Z" fill="#071621" />
  </g>
  <!-- Decorative large accent orb -->
  <g opacity="0.9">
    <circle cx="830" cy="340" r="210" fill="url(#orbGrad)"/>
    <circle cx="830" cy="340" r="210" fill="url(#orbStripes)" style="mix-blend-mode:overlay; opacity:0.25"/>
    <circle cx="830" cy="340" r="210" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="5"/>
  </g>
  <!-- Left matrix of hollow circles (2 x 3) -->
  <g transform="translate(115,225)">
    <circle class="stroke-circle" cx="0" cy="0" r="50"/>
    <circle class="stroke-circle" cx="130" cy="0" r="50"/>
    <circle class="stroke-circle" cx="260" cy="0" r="50"/>
    <circle class="stroke-circle" cx="0" cy="130" r="50"/>
    <circle class="stroke-circle" cx="130" cy="130" r="50"/>
    <circle class="stroke-circle" cx="260" cy="130" r="50"/>
  </g>
  <!-- Wordmark top-left (reduced size, left aligned) -->
  <text x="105" y="135" class="wordmark" font-size="108" fill="#F5FAFC">Go<tspan fill="#00C48C">Uply</tspan></text>
  <!-- Tagline below circles, left aligned -->
  <text x="115" y="415" class="tagline" font-size="60" text-anchor="start" fill="#F5FAFC">Train. <tspan fill="#F5FAFC">Build.</tspan> <tspan fill="#00C48C">Elevate.</tspan></text>
  <!-- Bottom info bar (shortened so it doesn't slice orb visually) -->
  <line x1="105" y1="470" x2="760" y2="470" class="divider"/>
  <text x="105" y="530" class="meta" font-size="48" fill="#F5FAFC">Ngwa Kevin A.</text>
  <text x="105" y="585" class="meta" font-size="42" fill="#00C48C">+1 (555) 123-4567</text>
  <!-- QR placeholder bottom-right (raised slightly) -->
  <g>
    <rect x="915" y="485" width="150" height="150" rx="22" fill="#0E2533" stroke="#163544" stroke-width="4"/>
    <text x="990" y="570" class="meta muted" font-size="38" text-anchor="middle">QR</text>
  </g>
</svg>
